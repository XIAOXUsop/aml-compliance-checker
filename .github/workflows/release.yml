# 发布流程：把插件 ZIP 挂到 GitHub Release 上。
#
# 触发方式：在 GitHub 上把 Build 工作流创建的 draft release 正式发布。
#
# **本工作流不发布到 JetBrains Marketplace。**
# publishPlugin 需要 PUBLISH_TOKEN、CERTIFICATE_CHAIN、PRIVATE_KEY、PRIVATE_KEY_PASSWORD
# 四个 secrets；本仓库没有这些，保留该步骤只会让每次发布都以一个必然失败的 job 结束，
# 而 README 却看起来"有 Marketplace 发布流程"。等这些凭据齐备、且有人持续维护时再启用。

name: Release

on:
  release:
    types: [ prereleased, released ]

jobs:

  release:
    name: Attach plugin ZIP to the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # 版本号必须来自 tag。
      #
      # `gradle.properties` 里那份从 v0.4.1 起就没再动过（`version = 0.4.1`），
      # 于是 v0.4.2 / v0.4.3 / v0.4.4 构建出来的产物**全叫
      # `aml-compliance-checker-0.4.1.zip`**，插件内部的 `<version>` 也是 0.4.1
      # ——装了 v0.4.4 的人在 IDEA 里看到的是 0.4.1，而 Release 页面上挂着的
      # asset 名与 tag 对不上。实测于 2026-09-18。
      #
      # `-Pversion` 能同时驱动产物名与 plugin.xml 的 `<version>`（已本地验证），
      # 所以这里以 tag 为准，开发者本地构建仍用 gradle.properties 的值。
      - name: Build plugin
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: ./gradlew buildPlugin -Pversion="${TAG#v}"

      - name: Show the artifact that will be uploaded
        run: ls -la ./build/distributions/

      # 断言落在**产物本身**上，而不是落在构建命令上。
      #
      # 上面的 `-Pversion` 传对了，不代表产物里的版本号就对——v0.4.4 正是这么发出去的：
      # 命令没错、构建成功、`Show the artifact` 也照常打印，而 zip 名、包内 jar 名、
      # plugin.xml 的 `<version>` 三者全是 0.4.1。**没有任何一步会因为这件事变红。**
      # 使用者装进 IDEA 才看到版本对不上，而那时已经发布出去了。
      #
      # 所以这里把三者逐个与 tag 比一遍。多比几个地方不是啰嗦：这三处是三个不同的
      # 代码路径写的（zip 名与 jar 名由产物配置决定，`<version>` 由 plugin.xml 决定），
      # v0.4.4 那次三者**同时**错了，说明它们共用一个来源——但没道理假定以后也一起对。
      - name: 断言产物里的版本号等于 tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"

          # ⚠️ 不能写 `ls build/distributions/*.zip | head -1`。
          #
          # 那样在**只有一个 zip** 时是对的，也正是 CI 里的情形——但本地构建目录里
          # 攒着历史产物时，它会按字典序挑中**最快的那一个**：2026-09-20 在本机试，
          # `build/distributions/` 下同时有 0.4.1、0.4.5、9.9.9 三个 zip，
          # `head -1` 拿到的是 **0.4.1**，于是断言在验一个**根本不是这次构建**的文件。
          # 那次是"验错了对象"，不是"验出了错"——后者会红，前者会绿。
          #
          # 所以：多于一个就直接失败，让人看清楚该清哪个目录，而不是猜。
          mapfile -t zips < <(ls build/distributions/*.zip 2>/dev/null || true)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::build/distributions/ 下没有 zip——buildPlugin 没产出东西"
            exit 1
          fi
          if [ "${#zips[@]}" -ne 1 ]; then
            printf '::error::build/distributions/ 下有 %d 个 zip，无法确定该验哪一个：\n' "${#zips[@]}"
            printf '  %s\n' "${zips[@]}"
            echo "::error::先清掉 build/distributions/ 再构建——断言必须打在本次构建的产物上"
            exit 1
          fi
          zip="${zips[0]}"
          echo "产物: $zip   期望版本: $want"

          fail=0
          got_zip=$(basename "$zip" .zip)
          got_zip="${got_zip##*-}"
          [ "$got_zip" = "$want" ] || {
            echo "::error::zip 名里的版本是 $got_zip，tag 是 $want"; fail=1; }

          tmp=$(mktemp -d)
          unzip -q -o "$zip" -d "$tmp"
          jar=$(find "$tmp" -name '*.jar' | head -1)
          inner=$(basename "$jar" .jar)
          got_jar="${inner##*-}"
          [ "$got_jar" = "$want" ] || {
            echo "::error::包内 jar 名里的版本是 $got_jar，tag 是 $want"; fail=1; }

          # `<version>` 是唯一会被 IDEA 读走、显示在插件列表里的那个
          got_xml=$(unzip -p "$jar" META-INF/plugin.xml \
            | tr -d '\r' | grep -o '<version>[^<]*' | head -1 | cut -d'>' -f2)
          [ "$got_xml" = "$want" ] || {
            echo "::error::plugin.xml 的 <version> 是 $got_xml，tag 是 $want"; fail=1; }

          rm -rf "$tmp"
          if [ "$fail" -ne 0 ]; then
            echo "::error::产物版本与 tag 不一致，拒绝上传——这正是 v0.4.4 那次事故"
            exit 1
          fi
          echo "zip 名 / jar 名 / plugin.xml 三处都等于 $want"

      # Upload the plugin ZIP as a release asset
      #
      # `--clobber` 是必需的，不是保险：这个工作流在每次 release 事件上重跑，
      # 而 `gh release upload` 默认**不覆盖**同名 asset——第二次运行会直接
      # `asset under the same name already exists` 并以 1 退出。
      #
      # 实测（2026-09-17，v0.4.1）：Release 是手动建的、asset 也是手动附的，
      # 于是这次工作流跑起来必然失败。产物本身是好的，但 CI 上多了一次红色，
      # 而且这个工作流从此**再也无法重跑**——想用它重新构建产物都做不到。
      #
      # 覆盖是这里正确的语义：产物应当以**从该 tag 源码构建出来的那一份**为准。
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --clobber ${{ github.event.release.tag_name }} ./build/distributions/*

      # Update the Unreleased section with the current release note
      #
      # ⚠️ `-Pversion` 不能省，理由与上面 Build plugin 那一步**完全相同**。
      # 这个任务是按 `project.version` 决定往 CHANGELOG 里写哪个版本段的，
      # 而不传它时 `project.version` 取的是 `gradle.properties` 里那个值
      # （v0.4.1 起就没再动过）。实测于 2026-09-19：
      #
      #   ./gradlew patchChangelog --release-note-file=…            → 不生成任何新段
      #   ./gradlew patchChangelog --release-note-file=… -Pversion=9.9.9
      #                                                            → 生成 `## [9.9.9] - …`
      #
      # 前者正是线上发生的事：任务以 0 退出、日志里 `BUILD SUCCESSFUL`，
      # 而 CHANGELOG 一个字节都没改——于是「无变化」分支把它记成「无需提 PR」，
      # 这个 job 从此绿着通过，而 CHANGELOG 再也不会被发布流程更新。
      # 这与上面那个「三个版本的产物都叫 0.4.1」是同一个根因：**版本号必须来自 tag**。
      #
      # 另有一条实测出来的行为，写在这里免得有人踩：
      # `--release-note-file` 是**取代**而不是合并新段的正文。同一份 [Unreleased] 内容：
      #   带 --release-note-file → 新段的正文是那个文件的内容，[Unreleased] 下的条目被丢弃
      #   不带                   → [Unreleased] 的条目被搬进新段
      # 也就是说**手写在 [Unreleased] 下的条目不会因发布而进 CHANGELOG**，
      # 本仓库的发布说明以 GitHub Release 正文为准。
      - name: Patch Changelog
        if: ${{ github.event.release.body != '' }}
        env:
          CHANGELOG: ${{ github.event.release.body }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          RELEASE_NOTE="./build/tmp/release_note.txt"
          mkdir -p "$(dirname "$RELEASE_NOTE")"
          echo "$CHANGELOG" > $RELEASE_NOTE

          ./gradlew patchChangelog --release-note-file=$RELEASE_NOTE -Pversion="${TAG#v}"

      # Create a pull request
      #
      # 这一步把上面 patchChangelog 的结果提成一个 PR，需要仓库设置里开启
      # 「Allow GitHub Actions to create and approve pull requests」——**默认是关的**，
      # 于是 `gh pr create` 以 `GitHub Actions is not permitted to create or approve
      # pull requests` 失败（实测 v0.4.2：分支推上去了，PR 建不出来）。
      #
      # 这里刻意不让它失败：那个开关同时允许 Actions **批准** PR，为一个自动更新
      # CHANGELOG 的便利功能去放宽它划不来。分支照推、PR 留给人手动建，并在日志里
      # 明确说出来——而不是让每次发布都以一个红色 job 结束。
      #
      # 要让它真正自动建 PR：仓库 Settings → Actions → General → Workflow permissions
      # 勾上那一项，再把下面的 `|| echo` 去掉。
      - name: Create Pull Request
        if: ${{ github.event.release.body != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          BRANCH="changelog-update-$VERSION"
          LABEL="release changelog"

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          git checkout -b $BRANCH

          # 无变化时 `git commit` 会以非零退出，而脚本是 `bash -e`：先看一眼
          if git diff --quiet && git diff --cached --quiet; then
            echo "::notice::CHANGELOG 已经是这个版本的内容，无需提 PR"
            exit 0
          fi
          git commit -am "Changelog update - $VERSION"

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            git push --force origin "$BRANCH"
          else
            git push --set-upstream origin "$BRANCH"
          fi

          gh label create "$LABEL" \
            --description "Pull requests with release changelog update" \
            --force \
            || true

          gh pr create \
            --title "Changelog update - \`$VERSION\`" \
            --body "Current pull request contains patched \`CHANGELOG.md\` file for the \`$VERSION\` version." \
            --label "$LABEL" \
            --head $BRANCH \
            || echo "::warning::分支 $BRANCH 已推送，但自动建 PR 需要仓库开启 'Allow GitHub Actions to create and approve pull requests'（Settings → Actions → General）。请手动建 PR，或开启该设置后重跑本工作流。"
